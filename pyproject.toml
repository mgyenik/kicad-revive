[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kicad-revive"
dynamic = ["version"]
description = "Convert legacy KiCad projects to the modern file format, and verify the result against the board"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Michael Yenik" }]
keywords = [
    "kicad", "eeschema", "pcb", "schematic", "eda",
    "legacy", "migration", "file-format",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Utilities",
]
# No runtime dependencies: this is a file-format tool and should stay
# installable anywhere, including inside a KiCad scripting environment.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.6",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/mgyenik/kicad-revive"
Issues = "https://github.com/mgyenik/kicad-revive/issues"
Changelog = "https://github.com/mgyenik/kicad-revive/blob/main/CHANGELOG.md"

[project.scripts]
kicad-revive = "kicad_revive.cli:main"

[tool.hatch.version]
path = "src/kicad_revive/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kicad_revive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "kicad_cli: requires a real kicad-cli installation",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "UP007",   # Optional[X] reads more clearly than X | None here
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
